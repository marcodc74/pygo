name: release

# Pushing a tag like v0.1.0 (or running the workflow manually with a tag
# name) builds the binaries for every OS/arch and publishes a GitHub release
# with them and their SHA-256 checksums. When run manually, the tag is
# created by the release on the commit the workflow runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test
        run: go test ./...
      - name: build binaries
        run: make dist VERSION=${TAG}
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: smoke test
        run: ./dist/pygo-linux-amd64 version | grep "${TAG}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: docs/releases/<tag>.md when present, else a generic text
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Pygo $TAG" \
              --notes-file "docs/releases/$TAG.md"
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Pygo $TAG" \
            --notes-file - <<'NOTES'
          Pygo, an AI-first programming language: single static binary, no dependencies.

          Download the binary for your platform, rename it to `pygo` (`pygo.exe` on Windows), then:

          ```sh
          pygo guide                      # compact language reference for a model context
          pygo run --allow net app.pg     # run with the net capability
          pygo check --json app.pg        # machine-readable diagnostics
          ```

          Verify downloads with `sha256sum -c SHA256SUMS`.
          See README.md and docs/SPEC.md for details.
          NOTES
