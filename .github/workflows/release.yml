name: release

# Pushing a tag like v0.1.0 builds the binaries for every OS/arch and
# publishes a GitHub release with them and their SHA-256 checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: test
        run: go test ./...
      - name: build binaries
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: smoke test
        run: ./dist/pygo-linux-amd64 version | grep "${GITHUB_REF_NAME}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pygo $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Pygo, an AI-first programming language: single static binary, no dependencies.

          Download the binary for your platform, rename it to `pygo` (`pygo.exe` on Windows), then:

          ```sh
          pygo guide                      # compact language reference for a model context
          pygo run --allow net app.pg     # run with the net capability
          pygo check --json app.pg        # machine-readable diagnostics
          ```

          Verify downloads with `sha256sum -c SHA256SUMS`.
          See README.md and docs/SPEC.md for details.
          NOTES
